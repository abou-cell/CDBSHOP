name: Build CBD OM Offline APKs
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build both APKs
        run: gradle --no-daemon :client:assembleDebug :admin:assembleDebug
      - name: Collect APKs
        run: |
          mkdir -p dist
          cp client/build/outputs/apk/debug/client-debug.apk dist/CBD-OM-Client-Offline-v0.4.apk
          cp admin/build/outputs/apk/debug/admin-debug.apk dist/CBD-OM-Admin-Offline-v0.4.apk
          sha256sum dist/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CBD-OM-Offline-APKs-v0.4
          path: dist/*.apk
          retention-days: 30
